name: FamilyGuard checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check && npm test && npm run build
      - run: python ../scripts/audit-manifests.py
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew :native:testDebugUnitTest :native:assembleDebug
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get && flutter analyze && flutter test && flutter build apk --debug
        working-directory: apps/parent_app
      - run: flutter pub get && flutter analyze && flutter test && flutter build apk --debug
        working-directory: apps/child_app
      - run: python scripts/audit-manifests.py
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: apps/*/build/app/outputs/flutter-apk/*.apk
